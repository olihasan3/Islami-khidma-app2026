<!DOCTYPE html>
<html lang="bn">

<script src="https://cdn.tailwindcss.com"></script>

<body class="bg-gray-50 text-gray-800 pb-24">

    <!-- হেডার বা লোগো সেকশন -->
    <header class="bg-white border-b border-emerald-100 sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center max-w-md">
            <div class="flex items-center space-x-2">

                <div>

    <main class="container mx-auto px-4 py-4 max-w-md">

        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-4">

                <span>📍 আপনার বর্তমান অবস্থান</span>

            </div>
            <div id="locationStatus" class="text-sm text-gray-600 mb-2">

            </div>
            <div id="placeName" class="p-3 bg-emerald-50 rounded-xl text-emerald-800 font-semibold text-sm mb-3" style="display:none;"></div>
            
            <button class="w-full bg-emerald-700 text-white py-3 rounded-xl font-bold text-sm shadow hover:bg-emerald-800 transition" id="gpsBtn" type="button">
                📍 আমার বর্তমান অবস্থান নিন
            </button>
            
            <div id="map" class="mt-3"></div>
        </div>

        <div class="mb-4">
            <div class="relative">
                <input type="text" id="searchBox" placeholder="কী প্রয়োজন? লিখুন (যেমন: বাজার, ওষুধ)..." class="w-full p-3.5 pl-11 bg-white rounded-xl shadow-sm border border-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-600 text-sm">
                <span class="absolute left-4 top-3.5 text-gray-400 text-lg">🔍</span>
            </div>
        </div>

        <!-- কাছাকাছি ড্রাইভার সেকশন -->

                </div>

        </div>

            <div class="grid grid-cols-4 gap-3 text-center">
                <button onclick="serviceClick('বাজার')" class="flex flex-col items-center p-2 rounded-xl hover:bg-emerald-50 transition">

                    <span class="text-[11px] font-semibold text-gray-700">বাজার</span>
                </button>
                <button onclick="serviceClick('রিকশা/অটো')" class="flex flex-col items-center p-2 rounded-xl hover:bg-emerald-50 transition">

                    <span class="text-[11px] font-semibold text-gray-700">রিকশা/অটো</span>
                </button>
                <button onclick="serviceClick('খাবার')" class="flex flex-col items-center p-2 rounded-xl hover:bg-emerald-50 transition">
                    <div class="w-12 h-12 bg-emerald-50 text-emerald-700 rounded-xl flex items-center justify-center text-xl mb-1 border border-emerald-100">🍱</div>
                    <span class="text-[11px] font-semibold text-gray-700">খাবার</span>
                </button>
                <button onclick="serviceClick('ওষুধ')" class="flex flex-col items-center p-2 rounded-xl hover:bg-emerald-50 transition">
                    <div class="w-12 h-12 bg-emerald-50 text-emerald-700 rounded-xl flex items-center justify-center text-xl mb-1 border border-emerald-100">💊</div>
                    <span class="text-[11px] font-semibold text-gray-700">ওষুধ</span>
                </button>
                <button onclick="serviceClick('পার্সেল')" class="flex flex-col items-center p-2 rounded-xl hover:bg-emerald-50 transition">
                    <div class="w-12 h-12 bg-emerald-50 text-emerald-700 rounded-xl flex items-center justify-center text-xl mb-1 border border-emerald-100">📦</div>
                    <span class="text-[11px] font-semibold text-gray-700">পার্সেল</span>
                </button>
                <button onclick="serviceClick('কাজের লোক')" class="flex flex-col items-center p-2 rounded-xl hover:bg-emerald-50 transition">
                    <div class="w-12 h-12 bg-emerald-50 text-emerald-700 rounded-xl flex items-center justify-center text-xl mb-1 border border-emerald-100">👷</div>
                    <span class="text-[11px] font-semibold text-gray-700">কাজের লোক</span>
                </button>
                <button onclick="serviceClick('গাড়ি')" class="flex flex-col items-center p-2 rounded-xl hover:bg-emerald-50 transition">
                    <div class="w-12 h-12 bg-emerald-50 text-emerald-700 rounded-xl flex items-center justify-center text-xl mb-1 border border-emerald-100">🚗</div>
                    <span class="text-[11px] font-semibold text-gray-700">গাড়ি</span>
                </button>
                <button onclick="serviceClick('দোকান')" class="flex flex-col items-center p-2 rounded-xl hover:bg-emerald-50 transition">
                    <div class="w-12 h-12 bg-emerald-50 text-emerald-700 rounded-xl flex items-center justify-center text-xl mb-1 border border-emerald-100">🏪</div>
                    <span class="text-[11px] font-semibold text-gray-700">দোকান</span>
                </button>
            </div>
        </div>

    </main>

    <!-- ফিক্সড বটম নেভিগেশন -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2.5 shadow-lg max-w-md mx-auto z-50">
        <div class="flex justify-around items-center text-gray-500">
            <button class="flex flex-col items-center text-emerald-700">
                <span class="text-lg">🏠</span>
                <span class="text-[10px] font-bold">Home</span>
            </button>
            <button onclick="orders()" class="flex flex-col items-center hover:text-emerald-700">
                <span class="text-lg">📦</span>
                <span class="text-[10px]">Orders</span>
            </button>
            <button onclick="profile()" class="flex flex-col items-center hover:text-emerald-700">
                <span class="text-lg">👤</span>
                <span class="text-[10px]">আমি</span>
            </button>
        </div>
    </nav>
