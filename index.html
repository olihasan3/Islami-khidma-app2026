<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ইসলামী খিদমাহ - Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f8f4;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 92%;
      max-width: 420px;
      background: white;
      padding: 30px 22px;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.10);
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #087f3f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }

    h1 {
      margin: 10px 0 5px;
      color: #087f3f;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
      font-size: 15px;
    }

    .login-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      background: #087f3f;
      color: white;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      font-size: 14px;
      min-height: 20px;
    }

    .info {
      margin-top: 25px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 10px;
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      🤝
    </div>

    <h1>ইসলামী খিদমাহ</h1>

    <div class="subtitle">
      মানুষের সেবায়, মানুষের পাশে
    </div>

    <button
      id="googleLogin"
      class="login-btn"
    >
      🔵 Google দিয়ে শুরু করুন
    </button>

    <div id="status"></div>

    <div class="info">
      Google দিয়ে Login করার পর আপনার Profile তৈরি করতে হবে।
      <br>
      Profile-এ Live Selfie, মোবাইল নম্বর ও ঠিকানা দিতে হবে।
    </div>

  </div>


  <!-- Firebase Login -->
  <script type="module">

    import { auth } from "./firebase.js";

    import {
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    const googleLogin =
      document.getElementById("googleLogin");

    const status =
      document.getElementById("status");


    googleLogin.addEventListener(
      "click",
      async () => {

        const provider =
          new GoogleAuthProvider();


        googleLogin.disabled = true;

        googleLogin.innerText =
          "⏳ Login হচ্ছে...";

        status.innerText = "";


        try {

          const result =
            await signInWithPopup(
              auth,
              provider
            );


          const user =
            result.user;


          console.log(
            "Login User:",
            user
          );


          status.innerText =
            "✅ Login সফল হয়েছে";


          /*
            গুরুত্বপূর্ণ:

            Login-এর পর Home নয়,
            সরাসরি Profile Page যাবে।
          */

          setTimeout(() => {

            window.location.href =
              "./profile.html";

          }, 500);


        } catch (error) {

          console.error(
            "Google Login Error:",
            error
          );


          googleLogin.disabled = false;

          googleLogin.innerText =
            "🔵 Google দিয়ে শুরু করুন";


          status.innerText =
            "❌ Login করা যায়নি";


          alert(
            "Google Login করা যায়নি.\n\n" +
            error.message
          );

        }

      }
    );

  </script>

</body>
</html>
