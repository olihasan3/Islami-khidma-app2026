<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ইসলামী খিদমাহ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(145deg, #eafff2, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #173b29;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo {
      width: 135px;
      height: 135px;
      margin: 0 auto 15px;
      border-radius: 34px;
      background: linear-gradient(145deg, #078a45, #8bdc38);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 65px;
      color: white;
      box-shadow: 0 12px 30px rgba(0, 130, 60, .22);
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 29px;
      color: #078a45;
    }

    .tagline {
      text-align: center;
      color: #718278;
      font-size: 14px;
      margin: 8px 0 25px;
    }

    .card {
      background: white;
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 12px 40px rgba(0, 100, 50, .12);
      border: 1px solid #e1f1e7;
    }

    .welcome {
      text-align: center;
      margin-bottom: 24px;
    }

    .welcome h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .welcome p {
      margin: 0;
      color: #7b8981;
      font-size: 14px;
      line-height: 1.6;
    }

    .login-btn {
      width: 100%;
      height: 58px;
      border: none;
      border-radius: 17px;
      background: #078a45;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(0, 138, 69, .22);
    }

    .login-btn:active {
      transform: scale(.98);
    }

    .info {
      margin-top: 20px;
      padding: 14px;
      border-radius: 15px;
      background: #f1fbf5;
      color: #607268;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #8a958f;
      font-size: 12px;
      line-height: 1.7;
    }

    .green {
      color: #078a45;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">
      ☪
    </div>

    <h1>ইসলামী খিদমাহ</h1>

    <p class="tagline">
      আপনার প্রয়োজন, আমাদের খিদমাহ
    </p>

    <div class="card">

      <div class="welcome">
        <h2>স্বাগতম 👋</h2>

        <p>
          স্থানীয় প্রয়োজনীয় সেবা<br>
          এক জায়গা থেকেই শুরু করুন।
        </p>
      </div>

      <button class="login-btn" onclick="login()">
        Google দিয়ে শুরু করুন
      </button>

      <div class="info">
        🔒 আপনার তথ্য নিরাপদ রাখার জন্য
        ধাপে ধাপে পরিচয় যাচাই করা হবে।
      </div>

    </div>

    <div class="footer">
      <span class="green">✓ নিরাপদ</span>
      &nbsp; • &nbsp;
      সহজ &nbsp; • &nbsp;
      স্থানীয় সেবা
      <br>
      © 2026 ইসলামী খিদমাহ
    </div>

  </main>

  <script>
    function login() {
      alert("Google Login পরবর্তী ধাপে যুক্ত হবে।");
    }
  </script>

</body>
</html>
