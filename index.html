<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইসলামী খিদমাহ - লগইন ও ফেস ভেরিফিকেশন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-sm border border-gray-100 space-y-6">
        
        <!-- লোগো ও হেডার -->
        <div class="text-center space-y-1">
            <span class="text-4xl">☪️</span>
            <h1 class="font-bold text-emerald-900 text-xl">ইসলামী খিদমাহ</h1>
            <p class="text-xs text-gray-500">নিরাপদ ও নির্ভরযোগ্য খিদমাহ পাওয়ার জন্য ভেরিফিকেশন সম্পন্ন করুন</p>
        </div>

        <!-- ধাপ ১: গুগল লগইন -->
        <div id="loginSection" class="space-y-3">
            <button onclick="googleLogin()" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 py-3 rounded-2xl font-bold text-sm shadow-sm hover:bg-gray-50 transition">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                Google দিয়ে লগইন করুন
            </button>
        </div>

        <!-- ধাপ ২: লাইভ ফেস ভেরিফিকেশন (লগইন হওয়ার পর দেখাবে) -->
        <div id="faceVerificationSection" class="space-y-4 hidden">
            <div class="text-center">
                <h3 class="font-bold text-emerald-900 text-sm">👤 লাইভ ফেস ভেরিফিকেশন</h3>
                <p id="instructionText" class="text-xs text-gray-600 mt-1">ক্যামেরার সামনে তাকান...</p>
            </div>

            <!-- ক্যামেরা প্রিভিউ বক্স -->
            <div class="relative w-full h-64 bg-black rounded-2xl overflow-hidden shadow-inner flex items-center justify-center">
                <video id="videoElement" autoplay playsinline class="w-full h-full object-cover"></video>
                <div class="absolute inset-0 border-4 border-emerald-500 rounded-2xl pointer-events-none opacity-50 flex items-center justify-center">
                    <div class="w-36 h-48 border-2 border-dashed border-white rounded-full"></div>
                </div>
            </div>

            <!-- প্রোগ্রেস ইন্ডিকেটর -->
            <div class="flex justify-between text-xs font-semibold text-gray-500 px-2">
                <span id="step1" class="text-emerald-700">১. মাথা উঁচু</span>
                <span id="step2">২. চোখ মিটিমিটি</span>
                <span id="step3">৩. স্মাইল</span>
            </div>

            <button id="startVerifyBtn" onclick="startFaceScan()" class="w-full bg-emerald-700 text-white py-3 rounded-2xl font-bold text-sm shadow hover:bg-emerald-800 transition">
                ভেরিফিকেশন শুরু করুন
            </button>
        </div>

        <!-- সিকিউরিটি নোট -->
        <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100 text-[11px] text-emerald-800 text-center leading-relaxed">
            🔒 ভেরিফিকেশনের জন্য আপনার ডেটা কঠোরভাবে সংরক্ষিত থাকবে, কেউ দেখতে পারবে না।
        </div>

    </div>

    <!-- ফায়ারবেস এবং লজিক স্ক্রিপ্ট -->
    <script type="module">
        import { auth } from "./firebase.js";
        import { GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const loginSection = document.getElementById("loginSection");
        const faceVerificationSection = document.getElementById("faceVerificationSection");
        const videoElement = document.getElementById("videoElement");
        const instructionText = document.getElementById("instructionText");
        
        let videoStream = null;
        const provider = new GoogleAuthProvider();

        // পেজ লোড হওয়ার সাথে সাথে চেক করা ইউজার অলরেডি লগইন করা আছে কিনা
        onAuthStateChanged(auth, (user) => {
            if (user) {
                showFaceVerification();
            }
        });

        // রিডাইরেক্ট রেজাল্ট হ্যান্ডেল করা
        getRedirectResult(auth).catch((error) => {
            console.error("Redirect Error: ", error);
        });

        // গুগল লগইন ফাংশন (প্রথমে পপআপ ট্রাই করবে, মোবাইল বা ব্রাউজারে সমস্যা হলে অটো রিডাইরেক্ট করবে)
        window.googleLogin = async function() {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.log("Popup failed, trying redirect...", error);
                try {
                    await signInWithRedirect(auth, provider);
                } catch (err) {
                    alert("লগইন করতে সমস্যা হয়েছে: " + err.message);
                }
            }
        }

        function showFaceVerification() {
            loginSection.classList.add("hidden");
            faceVerificationSection.classList.remove("hidden");
            initCamera();
        }

        // ক্যামেরা অন করার ফাংশন
        async function initCamera() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoElement.srcObject = videoStream;
            } catch (err) {
                alert("ক্যামেরা পারমিশন পাওয়া যায়নি! দয়া করে ব্রাউজারের ক্যামেরা পারমিশন অন করুন।");
            }
        }

        // ফেস স্ক্যান ও ধাপে ধাপে নির্দেশনা সিমুলেশন
        window.startFaceScan = function() {
            const btn = document.getElementById("startVerifyBtn");
            btn.disabled = true;
            btn.innerText = "যাচাই করা হচ্ছে...";

            // স্টেপ ১: মাথা উঁচু করা
            instructionText.innerText = "দয়া করে সামান্য মাথা উঁচু করুন...";
            setTimeout(() => {
                document.getElementById("step1").classList.remove("text-emerald-700");
                document.getElementById("step2").classList.add("text-emerald-700");
                
                // স্টেপ ২: চোখ মিটিমিটি করা
                instructionText.innerText = "এবার চোখ একবার মিটিমিটি (Blink) করুন...";
                setTimeout(() => {
                    document.getElementById("step2").classList.remove("text-emerald-700");
                    document.getElementById("step3").classList.add("text-emerald-700");
                    
                    // স্টেপ ৩: স্মাইল দেওয়া
                    instructionText.innerText = "একটি মিষ্টি হাসি দিন (Smile)...";
                    setTimeout(() => {
                        // ক্যামেরা বন্ধ করে দ্বিতীয় ধাপে রিডাইরেক্ট করা
                        if (videoStream) {
                            videoStream.getTracks().forEach(track => track.stop());
                        }
                        alert("আলহামদুলিল্লাহ! ফেস ভেরিফিকেশন সফল হয়েছে।");
                        window.location.href = "./register-details.html"; // দ্বিতীয় ধাপের পেজ
                    }, 2500);

                }, 2500);

            }, 2500);
        }
    </script>
</body>
    </html>
