<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ইসলামী খিদমাহ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f8f4;
      color: #123d29;
    }

    .container {
      max-width: 420px;
      margin: auto;
      min-height: 100vh;
      padding: 25px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo {
      width: 85px;
      height: 85px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #087f3f;
      color: #ffd700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }

    h1 {
      text-align: center;
      margin: 5px 0;
      color: #087f3f;
    }

    .tagline {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .welcome {
      text-align: center;
      margin-bottom: 20px;
    }

    .google-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #087f3f;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .google-btn:active {
      transform: scale(0.98);
    }

    .safe {
      text-align: center;
      font-size: 13px;
      color: #777;
      margin-top: 18px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">☪</div>

    <h1>ইসলামী খিদমাহ</h1>

    <div class="tagline">
      আপনার প্রয়োজন, আমাদের খিদমাহ
    </div>

    <div class="card">

      <div class="welcome">
        <h2>স্বাগতম</h2>
        <p>আপনার অ্যাকাউন্ট দিয়ে শুরু করুন</p>
      </div>

      <button class="google-btn" id="googleLogin">
        🔵 Google দিয়ে শুরু করুন
      </button>

      <div class="safe">
        🔒 আপনার তথ্য নিরাপদভাবে সংরক্ষণ করা হবে
      </div>

    </div>

  </div>

  <script type="module">

    import { auth } from "./firebase.js";

    import {
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const googleLogin = document.getElementById("googleLogin");

    googleLogin.addEventListener("click", async () => {

      const provider = new GoogleAuthProvider();

      try {

        const result = await signInWithPopup(auth, provider);

        const user = result.user;

        alert("স্বাগতম " + user.displayName);

      } catch (error) {

        console.error(error);

        alert("Google Login করা যায়নি। আবার চেষ্টা করুন।");

      }

    });

  </script>

</body>
</html>
