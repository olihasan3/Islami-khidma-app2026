}

.search{

}

.search input{

.service{

font-size:17px;

}

.service span{
display:block;

border:none;

}

}
</style></head><body><div class="header">

<p>আপনার প্রয়োজন, আমাদের খিদমাহ</p>
<div id="welcome">ব্যবহারকারী যাচাই হচ্ছে...</div>
</div><div class="location"><div class="location-title">
📍 আপনার বর্তমান অবস্থান
</div><div id="locationStatus">
GPS অবস্থান নেওয়া হয়নি।
</div><div id="placeName" class="place-name" style="display:none;"></div><button class="gps-btn" id="gpsBtn" type="button">
📍 আমার বর্তমান অবস্থান নিন
</button><div id="map"></div></div><div class="nearby-title">
🛺 কাছাকাছি Online চালক
</div><div id="driverList">
<div class="driver-card">
⏳ আগে আপনার বর্তমান অবস্থান নিন।
</div>
</div><div class="search"><input
type="text"
id="searchBox"
placeholder="কী প্রয়োজন? লিখুন">

</div><div class="services"><button class="service" onclick="serviceClick('বাজার')">
<span>🛒</span>
বাজার
</button><button class="service" onclick="serviceClick('রিকশা/অটো')">
<span>🛺</span>
রিকশা/অটো
</button><button class="service" onclick="serviceClick('খাবার')">
<span>🍱</span>
খাবার
</button><button class="service" onclick="serviceClick('ওষুধ')">
<span>💊</span>
ওষুধ
</button><button class="service" onclick="serviceClick('পার্সেল')">
<span>📦</span>
পার্সেল
</button><button class="service" onclick="serviceClick('কাজের লোক')">
<span>👷</span>
কাজের লোক
</button><button class="service" onclick="serviceClick('গাড়ি')">
<span>🚗</span>
গাড়ি
</button><button class="service" onclick="serviceClick('দোকান')">
<span>🏪</span>
দোকান
</button></div><div class="bottom"><button class="active">
🏠<br>
Home
</button><button onclick="orders()">
📋<br>
Orders
</button><button onclick="profile()">
👤<br>
আমি
</button></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module">

import { auth } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
getDocs
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const db=getFirestore();

const welcome=document.getElementById("welcome");
const locationStatus=document.getElementById("locationStatus");
const placeName=document.getElementById("placeName");
const gpsBtn=document.getElementById("gpsBtn");
const driverList=document.getElementById("driverList");

let currentUser=null;
let userLatitude=null;
let userLongitude=null;
let userMarker=null;
let driverMarkers=[];

let map=L.map("map").setView(
[25.7439,89.2752],
7
);

L.tileLayer(
"https://tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"&copy; OpenStreetMap contributors"
}
).addTo(map);

onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href="./index.html";
return;

}

currentUser=user;

welcome.innerText=
"স্বাগতম, "+
(user.displayName||"ব্যবহারকারী");

});

function distanceKm(lat1,lon1,lat2,lon2){

const R=6371;

const dLat=(lat2-lat1)*Math.PI/180;
const dLon=(lon2-lon1)*Math.PI/180;

const a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2);

const c=2*Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

return R*c;

}

async function findNearbyDrivers(){

if(
userLatitude===null||
userLongitude===null
){

return;

}

driverList.innerHTML=
'<div class="driver-card">⏳ কাছাকাছি চালক খোঁজা হচ্ছে...</div>';

try{

const driversQuery=query(
collection(db,"users"),
where("driverOnline","==",true)
);

const snapshot=
await getDocs(driversQuery);

driverMarkers.forEach(
marker=>map.removeLayer(marker)
);

driverMarkers=[];

let drivers=[];

snapshot.forEach((docSnap)=>{

const data=docSnap.data();

if(
typeof data.latitude!=="number"||
typeof data.longitude!=="number"
){

return;

}

const distance=
distanceKm(
userLatitude,
userLongitude,
data.latitude,
data.longitude
);

if(distance<=5){

drivers.push({

id:docSnap.id,
vehicleType:data.vehicleType||"যানবাহন",
latitude:data.latitude,
longitude:data.longitude,
distance:distance

});

}

});

drivers.sort(
(a,b)=>a.distance-b.distance
);

if(drivers.length===0){

driverList.innerHTML=
'<div class="driver-card">😔 ৫ কিলোমিটারের মধ্যে এখন কোনো Online চালক পাওয়া যায়নি।</div>';

return;

}

driverList.innerHTML="";

drivers.forEach((driver,index)=>{

const card=
document.createElement("div");

card.className="driver-card";

const distanceText=
driver.distance<1
?Math.round(driver.distance*1000)+" মিটার"
:driver.distance.toFixed(1)+" কিমি";

card.innerHTML=
'<div class="driver-top">'+
'<div class="driver-name">🛺 চালক '+
(index+1)+
'</div>'+
'<div class="online-dot">🟢 Online</div>'+
'</div>'+
'<div class="driver-info">'+
'🚕 যানবাহন: '+
driver.vehicleType+
'<br>'+
'📍 দূরত্ব: '+
'<span class="distance">'+
distanceText+
'</span>'+
'</div>';

driverList.appendChild(card);

const marker=
L.marker(
[driver.latitude,driver.longitude]
).addTo(map);

marker.bindPopup(
"<b>🛺 Online চালক</b><br>"+
"যানবাহন: "+
driver.vehicleType+
"<br>দূরত্ব: "+
distanceText
);

driverMarkers.push(marker);

});

}

catch(error){

console.error(error);

driverList.innerHTML=
'<div class="driver-card">⚠️ চালকের অবস্থান এখন দেখা যাচ্ছে না। Firebase Permission পরীক্ষা করতে হবে।</div>';

}

}

gpsBtn.addEventListener(
"click",
function(){

locationStatus.innerText=
"⏳ আপনার বর্তমান অবস্থান খোঁজা হচ্ছে...";

gpsBtn.disabled=true;

gpsBtn.innerText=
"⏳ অবস্থান নেওয়া হচ্ছে...";

if(!navigator.geolocation){

locationStatus.innerText=
"❌ এই ব্রাউজারে GPS সুবিধা নেই।";

gpsBtn.disabled=false;

gpsBtn.innerText=
"📍 আবার চেষ্টা করুন";

return;

}

navigator.geolocation.getCurrentPosition(

async function(position){

userLatitude=
position.coords.latitude;

userLongitude=
position.coords.longitude;

const accuracy=
Math.round(
position.coords.accuracy
);

localStorage.setItem(
"khidma_latitude",
userLatitude
);

localStorage.setItem(
"khidma_longitude",
userLongitude
);

localStorage.setItem(
"khidma_gps_time",
new Date().toISOString()
);

map.setView(
[userLatitude,userLongitude],
16
);

if(userMarker){

map.removeLayer(userMarker);

}

userMarker=
L.marker(
[userLatitude,userLongitude]
).addTo(map);

userMarker.bindPopup(
"<b>📍 আপনার অবস্থান</b>"
).openPopup();

locationStatus.innerHTML=
"✅ GPS অবস্থান পাওয়া গেছে।<br>"+
"🎯 Accuracy: প্রায় "+
accuracy+
" মিটার";

placeName.style.display="block";
placeName.innerText=
"📍 আপনার বর্তমান অবস্থান";

gpsBtn.disabled=false;

gpsBtn.innerText=
"🔄 আবার অবস্থান নিন";

findNearbyDrivers();

try{

const apiUrl=
"https://api.bigdatacloud.net/data/"+
"reverse-geocode-client"+
"?latitude="+
encodeURIComponent(userLatitude)+
"&longitude="+
encodeURIComponent(userLongitude)+
"&localityLanguage=bn";

const response=
await fetch(apiUrl);

if(response.ok){

const data=
await response.json();

const city=
data.city||
data.locality||
data.principalSubdivision||
"";

const country=
data.countryName||
"বাংলাদেশ";

if(city){

const finalPlace=
city+", "+country;

placeName.innerText=
"📍 "+finalPlace;

localStorage.setItem(
"khidma_place_name",
finalPlace
);

}

}

}

catch(error){

console.log(
"Place name unavailable"
);

}

},

function(error){

console.error(error);

gpsBtn.disabled=false;

gpsBtn.innerText=
"📍 আবার GPS চেষ্টা করুন";

if(error.code===1){

locationStatus.innerText=
"❌ Location Permission বন্ধ আছে। Browser Settings থেকে Location Allow করুন।";

}

else if(error.code===2){

locationStatus.innerText=
"❌ অবস্থান পাওয়া যাচ্ছে না। ফোনের GPS/Location চালু করুন।";

}

else if(error.code===3){

locationStatus.innerText=
"⏳ GPS-এর উত্তর পেতে বেশি সময় লাগছে। আবার চেষ্টা করুন।";

}

else{

locationStatus.innerText=
"❌ GPS অবস্থান নেওয়া যায়নি।";

}

},

{
enableHighAccuracy:true,
timeout:30000,
maximumAge:0
}

);

});

const savedLat=
localStorage.getItem(
"khidma_latitude"
);

const savedLng=
localStorage.getItem(
"khidma_longitude"
);

if(savedLat&&savedLng){

userLatitude=Number(savedLat);
userLongitude=Number(savedLng);

map.setView(
[userLatitude,userLongitude],
16
);

userMarker=
L.marker(
[userLatitude,userLongitude]
).addTo(map);

userMarker.bindPopup(
"📍 আপনার সংরক্ষিত অবস্থান"
);

const savedPlace=
localStorage.getItem(
"khidma_place_name"
);

if(savedPlace){

placeName.style.display="block";

placeName.innerText=
"📍 "+savedPlace;

}

findNearbyDrivers();

}

</script><script>

function serviceClick(service){

alert(
service+
" সার্ভিস খুব শীঘ্রই চালু হবে।"
);

}

function orders(){

alert(
"আপনার Orders এখানে দেখা যাবে।"
);

}

function profile(){

window.location.href=
"./profile.html";

}

</script></body>
