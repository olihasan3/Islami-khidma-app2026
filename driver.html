<!DOCTYPE html><html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ইসলামী খিদমাহ - Ride</title><style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7f5;
color:#222;
padding-bottom:30px;
}

.header{
background:#087f3f;
color:white;
padding:22px 18px;
border-radius:0 0 22px 22px;
}

.header h1{
margin:0;
font-size:24px;
}

.header p{
margin:7px 0 0;
font-size:14px;
}

.container{
padding:15px;
}

.card{
background:white;
padding:18px;
border-radius:16px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

label{
display:block;
font-weight:bold;
margin-top:14px;
}

input,select{
width:100%;
padding:14px;
margin-top:8px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:0;
border-radius:10px;
background:#087f3f;
color:white;
font-size:16px;
font-weight:bold;
}

button:disabled{
opacity:.5;
}

.status{
margin-top:15px;
padding:14px;
border-radius:10px;
background:#f1f1f1;
text-align:center;
font-weight:bold;
line-height:1.6;
}

.success{
background:#e7f7ed;
color:#087f3f;
}

.error{
background:#fbeaea;
color:#b00020;
}

.request-box{
display:none;
margin-top:15px;
padding:15px;
background:#f4f7f5;
border-radius:12px;
line-height:1.8;
}

.back{
background:#555;
}
</style></head><body><div class="header">
<h1>☪️ ইসলামী খিদমাহ</h1>
<p>রিকশা / অটো / ইজিবাইক Ride</p>
</div><div class="container"><div class="card"><h3>🛺 Ride Request দিন</h3><label>
📍 কোথা থেকে যাবেন?
</label><input
id="pickup"
type="text"
placeholder="যেমন: জয়পুরহাট রেলস্টেশন">

<label>
📍 কোথায় যাবেন?
</label><input
id="destination"
type="text"
placeholder="যেমন: জয়পুরহাট বাজার">

<label>
👥 যাত্রী সংখ্যা
</label><select id="passengers"><option value="1">১ জন</option>
<option value="2">২ জন</option>
<option value="3">৩ জন</option>
<option value="4">৪ জন</option>
<option value="5">৫ জন</option>
<option value="6">৬ জন</option></select><label>
💰 আপনার প্রস্তাবিত ভাড়া
</label><input
id="fare"
type="number"
min="1"
placeholder="যেমন: 50">

<button id="sendBtn">
🛺 কাছের চালকদের কাছে Request পাঠান
</button><div id="status" class="status">
Ride Request এখনো পাঠানো হয়নি।
</div><div id="requestBox" class="request-box"><b>🟢 Request পাঠানো হয়েছে</b>

<br>📍 উঠার স্থান:
<span id="showPickup"></span>

<br>📍 গন্তব্য:
<span id="showDestination"></span>

<br>👥 যাত্রী:
<span id="showPassengers"></span>

<br>💰 প্রস্তাবিত ভাড়া:
<span id="showFare"></span> টাকা

<br><br>

⏳ কাছের Online চালকদের উত্তর অপেক্ষা করা হচ্ছে...

</div><button
class="back"
onclick="window.location.href='./home.html'">
⬅️ Home-এ ফিরে যান
</button>

</div></div><script type="module">

import { auth } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const db=getFirestore();

const pickup=
document.getElementById("pickup");

const destination=
document.getElementById("destination");

const passengers=
document.getElementById("passengers");

const fare=
document.getElementById("fare");

const sendBtn=
document.getElementById("sendBtn");

const status=
document.getElementById("status");

const requestBox=
document.getElementById("requestBox");

const showPickup=
document.getElementById("showPickup");

const showDestination=
document.getElementById("showDestination");

const showPassengers=
document.getElementById("showPassengers");

const showFare=
document.getElementById("showFare");

let currentUser=null;

onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href="./index.html";

return;

}

currentUser=user;

});

sendBtn.addEventListener(
"click",
async()=>{

if(!currentUser){

status.className="status error";

status.innerText=
"❌ আগে Google Login করুন।";

return;

}

const pickupText=
pickup.value.trim();

const destinationText=
destination.value.trim();

const passengerCount=
Number(passengers.value);

const fareAmount=
Number(fare.value);

if(!pickupText){

status.className="status error";

status.innerText=
"❌ কোথা থেকে যাবেন লিখুন।";

pickup.focus();

return;

}

if(!destinationText){

status.className="status error";

status.innerText=
"❌ কোথায় যাবেন লিখুন।";

destination.focus();

return;

}

if(!fareAmount || fareAmount<=0){

status.className="status error";

status.innerText=
"❌ প্রস্তাবিত ভাড়া লিখুন।";

fare.focus();

return;

}

sendBtn.disabled=true;

sendBtn.innerText=
"⏳ Request পাঠানো হচ্ছে...";

status.className="status";

status.innerText=
"⏳ কাছের চালকদের কাছে Request পাঠানো হচ্ছে...";

try{

const requestRef=
await addDoc(
collection(db,"rideRequests"),
{

customerId:
currentUser.uid,

customerName:
currentUser.displayName||"Customer",

pickup:
pickupText,

destination:
destinationText,

passengers:
passengerCount,

offeredFare:
fareAmount,

finalFare:
null,

status:
"waiting",

acceptedDriverId:
null,

createdAt:
serverTimestamp()

}
);

localStorage.setItem(
"khidma_ride_request_id",
requestRef.id
);

showPickup.innerText=
pickupText;

showDestination.innerText=
destinationText;

showPassengers.innerText=
passengerCount+" জন";

showFare.innerText=
fareAmount;

requestBox.style.display=
"block";

status.className=
"status success";

status.innerText=
"🟢 Ride Request সফলভাবে পাঠানো হয়েছে।";

sendBtn.innerText=
"✅ Request পাঠানো হয়েছে";

}

catch(error){

console.error(error);

status.className=
"status error";

status.innerText=
"❌ Request পাঠানো যায়নি। Firebase Permission পরীক্ষা করুন।";

sendBtn.disabled=false;

sendBtn.innerText=
"🛺 আবার Request পাঠান";

}

});

</script></body>
      </html>
