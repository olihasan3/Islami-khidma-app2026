<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইসলামী খিদমাহ - ড্রাইভার প্যানেল</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- হেডার -->
    <header class="bg-white border-b border-emerald-100 sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center max-w-md">
            <h1 class="font-bold text-emerald-900 text-base">🛺 ড্রাইভার প্যানেল</h1>
            <a href="./index.html" class="text-xs bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full font-semibold border border-emerald-200">হোম পেজ</a>
        </div>
    </header>

    <!-- মূল কন্টেন্ট -->
    <main class="container mx-auto px-4 py-4 max-w-md">
        <h2 class="text-sm font-bold text-emerald-900 mb-3">নতুন কাস্টমার রিকোয়েস্টসমূহ</h2>
        <div id="requestList" class="space-y-3">
            <div class="bg-white p-4 rounded-xl shadow-sm text-center text-sm text-gray-500">
                ⏳ রিকোয়েস্ট খোঁজা হচ্ছে...
            </div>
        </div>
    </main>

    <!-- জাভাস্ক্রিপ্ট -->
    <script type="module">
        import { auth, db } from "./firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const requestList = document.getElementById("requestList");

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "./index.html";
                return;
            }

            try {
                const q = query(collection(db, "requests"), where("status", "==", "pending"));
                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    requestList.innerHTML = '<div class="bg-white p-6 rounded-xl shadow-sm text-center text-sm text-gray-500">😔 এই মুহূর্তে কোনো নতুন রিকোয়েস্ট নেই।</div>';
                    return;
                }

                requestList.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const card = document.createElement("div");
                    card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-sm space-y-2";
                    
                    card.innerHTML = `
                        <div class="flex justify-between font-bold text-emerald-900 border-b pb-1">
                            <span>সেবা: ${data.serviceType}</span>
                            <span class="text-emerald-600">গ্রাহক: ${data.userName}</span>
                        </div>
                        <div class="text-gray-600 text-xs">
                            <strong>গন্তব্য:</strong> ${data.destination}<br>
                            <strong>নোট:</strong> ${data.note || "নেই"}
                        </div>
                        <button onclick="acceptRequest('${docSnap.id}')" class="w-full bg-emerald-700 text-white py-2 rounded-xl font-bold text-xs shadow hover:bg-emerald-800 transition">
                            ✅ রিকোয়েস্ট গ্রহণ করুন
                        </button>
                    `;
                    requestList.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                requestList.innerHTML = '<div class="bg-white p-4 rounded-xl shadow-sm text-center text-red-500">⚠️️ ডেটা লোড করতে সমস্যা হয়েছে।</div>';
            }
        });

        window.acceptRequest = async function(requestId) {
            try {
                await updateDoc(doc(db, "requests", requestId), { status: "accepted" });
                alert("আলহামদুলিল্লাহ! আপনি রিকোয়েস্টটি সফলভাবে গ্রহণ করেছেন।");
                location.reload();
            } catch (error) {
                console.error(error);
                alert("রিকোয়েস্ট গ্রহণ করতে সমস্যা হয়েছে।");
            }
        }
    </script>
</body>
</html>
