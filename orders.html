<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইসলামী খিদমাহ - আমার অর্ডারসমূহ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

    <!-- হেডার -->
    <header class="bg-white border-b border-emerald-100 sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center max-w-md">
            <h1 class="font-bold text-emerald-900 text-base">📦 আমার অর্ডার ও রিকোয়েস্ট</h1>
            <a href="./index.html" class="text-xs bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full font-semibold border border-emerald-200">হোম পেজ</a>
        </div>
    </header>

    <!-- মূল কন্টেন্ট -->
    <main class="container mx-auto px-4 py-4 max-w-md">
        <div id="orderList" class="space-y-3">
            <div class="bg-white p-4 rounded-xl shadow-sm text-center text-sm text-gray-500">
                ⏳ অর্ডারগুলো লোড হচ্ছে...
            </div>
        </div>
    </main>

    <!-- ফিক্সড বটম নেভিগেশন -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2.5 shadow-lg max-w-md mx-auto z-50">
        <div class="flex justify-around items-center text-gray-500">
            <button onclick="window.location.href='./index.html'" class="flex flex-col items-center hover:text-emerald-700">
                <span class="text-lg">🏠</span>
                <span class="text-[10px]">Home</span>
            </button>
            <button class="flex flex-col items-center text-emerald-700">
                <span class="text-lg">📦</span>
                <span class="text-[10px] font-bold">Orders</span>
            </button>
            <button onclick="window.location.href='./profile.html'" class="flex flex-col items-center hover:text-emerald-700">
                <span class="text-lg">👤</span>
                <span class="text-[10px]">আমি</span>
            </button>
        </div>
    </nav>

    <!-- জাভাস্ক্রিপ্ট -->
    <script type="module">
        import { auth, db } from "./firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const orderList = document.getElementById("orderList");

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "./index.html";
                return;
            }

            try {
                const q = query(collection(db, "requests"), where("userId", "==", user.uid));
                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    orderList.innerHTML = '<div class="bg-white p-6 rounded-xl shadow-sm text-center text-sm text-gray-500">😔 আপনার কোনো চলমান অর্ডার বা রিকোয়েস্ট নেই।</div>';
                    return;
                }

                orderList.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const card = document.createElement("div");
                    card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-sm space-y-1";
                    
                    let statusBadge = `<span class="text-orange-500 font-bold">⏳ অপেক্ষমাণ (Pending)</span>`;
                    if (data.status === "accepted") statusBadge = `<span class="text-emerald-600 font-bold">🟢 চালক গ্রহণ করেছে</span>`;

                    card.innerHTML = `
                        <div class="flex justify-between font-bold text-emerald-900 border-b pb-1">
                            <span>${data.serviceType}</span>
                            <span>${statusBadge}</span>
                        </div>
                        <div class="text-gray-600 text-xs pt-1">
                            <strong>গন্তব্য:</strong> ${data.destination}<br>
                            <strong>নোট:</strong> ${data.note || "কোনো নোট নেই"}<br>
                            <strong>সময়:</strong> ${new Date(data.createdAt).toLocaleTimeString('bn-BD')}
                        </div>
                    `;
                    orderList.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                orderList.innerHTML = '<div class="bg-white p-4 rounded-xl shadow-sm text-center text-sm text-red-500">⚠️ ডেটা লোড করতে সমস্যা হয়েছে।</div>';
            }
        });
    </script>
</body>
          </html>
