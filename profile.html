<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইসলামী খিদমাহ - প্রোফাইল</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

    <!-- হেডার -->
    <header class="bg-white border-b border-emerald-100 sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center max-w-md">
            <h1 class="font-bold text-emerald-900 text-base">👤 আমার প্রোফাইল</h1>
            <a href="./index.html" class="text-xs bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full font-semibold border border-emerald-200">হোম পেজ</a>
        </div>
    </header>

    <!-- মূল কন্টেন্ট -->
    <main class="container mx-auto px-4 py-4 max-w-md space-y-4">
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 text-center space-y-2">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-800 rounded-full flex items-center justify-center text-2xl mx-auto font-bold">👤</div>
            <h2 id="userName" class="font-bold text-emerald-900 text-base">লোড হচ্ছে...</h2>
            <p id="userEmail" class="text-xs text-gray-500">---</p>
        </div>

        <!-- ড্রাইভার মোড সেকশন -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
            <h3 class="font-bold text-emerald-900 text-sm border-b pb-2">🛺 ড্রাইভার / সেবাদাতা মোড</h3>
            <div class="flex items-center justify-between text-sm">
                <span>অনলাইন স্ট্যাটাস:</span>
                <button id="toggleDriverBtn" onclick="toggleDriverStatus()" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-xl font-bold text-xs transition">চেক করা হচ্ছে...</button>
            </div>
            <div class="space-y-1">
                <label class="block text-xs font-semibold text-gray-600">আপনার যানবাহনের ধরণ</label>
                <input type="text" id="vehicleTypeInput" placeholder="যেমন: অটোরিক্সা, মোটর সাইকেল" class="w-full p-2.5 border rounded-xl text-xs">
            </div>
            <button onclick="saveDriverInfo()" class="w-full bg-emerald-700 text-white py-2.5 rounded-xl font-bold text-xs shadow hover:bg-emerald-800 transition">তথ্য আপডেট করুন</button>
            <a href="./driver.html" class="block text-center w-full bg-emerald-50 text-emerald-800 py-2.5 rounded-xl font-bold text-xs border border-emerald-200 hover:bg-emerald-100 transition">ড্রাইভার প্যানেলে যান ➔</a>
        </div>

        <button onclick="logout()" class="w-full bg-red-50 text-red-600 py-3 rounded-2xl font-bold text-xs border border-red-200 hover:bg-red-100 transition">লগআউট করুন</button>
    </main>

    <!-- ফিক্সড বটম নেভিগেশন -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2.5 shadow-lg max-w-md mx-auto z-50">
        <div class="flex justify-around items-center text-gray-500">
            <button onclick="window.location.href='./index.html'" class="flex flex-col items-center hover:text-emerald-700">
                <span class="text-lg">🏠</span>
                <span class="text-[10px]">Home</span>
            </button>
            <button onclick="window.location.href='./orders.html'" class="flex flex-col items-center hover:text-emerald-700">
                <span class="text-lg">📦</span>
                <span class="text-[10px]">Orders</span>
            </button>
            <button class="flex flex-col items-center text-emerald-700">
                <span class="text-lg">👤</span>
                <span class="text-[10px] font-bold">আমি</span>
            </button>
        </div>
    </nav>

    <!-- জাভাস্ক্রিপ্ট -->
    <script type="module">
        import { auth, db } from "./firebase.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        let currentUser = null;
        let isOnline = false;

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "./index.html";
                return;
            }
            currentUser = user;
            document.getElementById("userName").innerText = user.displayName || "ব্যবহারকারী";
            document.getElementById("userEmail").innerText = user.email || "";

            // ফায়ারবেস থেকে ইউজারের ডাটা আনা
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists()) {
                const data = userDoc.data();
                isOnline = data.driverOnline || false;
                document.getElementById("vehicleTypeInput").value = data.vehicleType || "";
                updateDriverUI();
            }
        });

        window.updateDriverUI = function() {
            const btn = document.getElementById("toggleDriverBtn");
            if (isOnline) {
                btn.className = "bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-xs";
                btn.innerText = "🟢 Online আছি";
            } else {
                btn.className = "bg-gray-300 text-gray-800 px-4 py-2 rounded-xl font-bold text-xs";
                btn.innerText = "🔴 Offline আছি";
            }
        }

        window.toggleDriverStatus = async function() {
            if (!currentUser) return;
            isOnline = !isOnline;
            updateDriverUI();

            navigator.geolocation.getCurrentPosition(async (pos) => {
                await setDoc(doc(db, "users", currentUser.uid), {
                    driverOnline: isOnline,
                    latitude: pos.coords.latitude,
                    longitude: pos.coords.longitude,
                    vehicleType: document.getElementById("vehicleTypeInput").value || "অটো"
                }, { merge: true });
            }, async () => {
                await setDoc(doc(db, "users", currentUser.uid), { driverOnline: isOnline }, { merge: true });
            });
        }

        window.saveDriverInfo = async function() {
            if (!currentUser) return;
            const vehicleType = document.getElementById("vehicleTypeInput").value;
            await setDoc(doc(db, "users", currentUser.uid), { vehicleType }, { merge: true });
            alert("সফলভাবে তথ্য আপডেট হয়েছে!");
        }

        window.logout = function() {
            signOut(auth).then(() => { window.location.href = "./index.html"; });
        }
    </script>
</body>
  </html>
