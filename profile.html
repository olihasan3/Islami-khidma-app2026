<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ইসলামী খিদমাহ - Profile</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f5;
}

.header{
  background:#087f3f;
  color:white;
  padding:22px 18px;
  border-radius:0 0 22px 22px;
}

.header h1{
  margin:0;
  font-size:24px;
}

.container{
  padding:18px;
}

.card{
  background:white;
  padding:18px;
  border-radius:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.profile-photo{
  width:80px;
  height:80px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:auto;
}

.name{
  text-align:center;
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}

label{
  display:block;
  margin-top:18px;
  font-weight:bold;
}

input,textarea{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

video,#preview{
  width:100%;
  margin-top:10px;
  border-radius:12px;
  background:#111;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  background:#087f3f;
  color:white;
  font-size:16px;
  font-weight:bold;
}

button:disabled{
  opacity:.5;
}

#message{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="header">
  <h1>☪️ ইসলামী খিদমাহ</h1>
</div>

<div class="container">

<div class="card">

<img id="googlePhoto"
     class="profile-photo"
     src=""
     alt="Google Photo">

<div id="googleName" class="name">
  ব্যবহারকারী
</div>

<label>📸 লাইভ Selfie</label>

<video id="video"
       autoplay
       playsinline></video>

<button id="cameraBtn">
  📷 ক্যামেরা চালু করুন
</button>

<button id="captureBtn" disabled>
  📸 Selfie নিন
</button>

<img id="preview"
     style="display:none"
     alt="Selfie">

<label>📱 মোবাইল নম্বর</label>

<input
  id="phone"
  type="tel"
  inputmode="numeric"
  maxlength="11"
  placeholder="01XXXXXXXXX">

<label>🏠 ঠিকানা</label>

<textarea
  id="address"
  rows="3"
  placeholder="আপনার ঠিকানা লিখুন"></textarea>

<button id="saveBtn" disabled>
  💾 Profile Save করুন
</button>

<div id="message"></div>

</div>
</div>

<script type="module">

import { auth } from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* Firebase */

const db = getFirestore();


/* Elements */

const googlePhoto =
  document.getElementById("googlePhoto");

const googleName =
  document.getElementById("googleName");

const video =
  document.getElementById("video");

const preview =
  document.getElementById("preview");

const cameraBtn =
  document.getElementById("cameraBtn");

const captureBtn =
  document.getElementById("captureBtn");

const phone =
  document.getElementById("phone");

const address =
  document.getElementById("address");

const saveBtn =
  document.getElementById("saveBtn");

const message =
  document.getElementById("message");


let currentUser = null;
let stream = null;
let selfieTaken = false;


/* Login check */

onAuthStateChanged(auth,(user)=>{

  if(!user){

    window.location.href="./index.html";
    return;
  }

  currentUser=user;

  googleName.innerText =
    user.displayName || "ব্যবহারকারী";

  if(user.photoURL){

    googlePhoto.src=user.photoURL;

  }

  checkForm();

});


/* Camera */

cameraBtn.addEventListener("click",async()=>{

  try{

    stream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"user"
        },
        audio:false
      });

    video.srcObject=stream;

    captureBtn.disabled=false;

    cameraBtn.innerText=
      "✅ ক্যামেরা চালু হয়েছে";

  }

  catch(error){

    console.error(error);

    message.innerText=
      "❌ ক্যামেরা চালু করা যায়নি। Camera Permission Allow করুন।";

  }

});


/* Selfie */

captureBtn.addEventListener("click",()=>{

  if(!stream) return;

  const canvas=
    document.createElement("canvas");

  canvas.width=
    video.videoWidth;

  canvas.height=
    video.videoHeight;

  const ctx=
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  preview.src=
    canvas.toDataURL("image/jpeg",0.75);

  preview.style.display="block";

  selfieTaken=true;

  message.innerText=
    "✅ Selfie নেওয়া হয়েছে।";

  checkForm();

});


/* Form */

phone.addEventListener(
  "input",
  checkForm
);

address.addEventListener(
  "input",
  checkForm
);


function checkForm(){

  const validPhone=
    /^01[3-9]\d{8}$/.test(
      phone.value.trim()
    );

  const validAddress=
    address.value.trim().length>0;

  saveBtn.disabled=
    !(
      selfieTaken &&
      validPhone &&
      validAddress
    );

}


/* Save */

saveBtn.addEventListener("click",async()=>{

  if(!currentUser) return;


  const phoneValue=
    phone.value.trim();

  const addressValue=
    address.value.trim();


  saveBtn.disabled=true;

  saveBtn.innerText=
    "⏳ Firebase-এ Save হচ্ছে...";

  message.innerText="";


  try{

    await setDoc(

      doc(
        db,
        "users",
        currentUser.uid
      ),

      {

        uid:currentUser.uid,

        name:
          currentUser.displayName || "",

        email:
          currentUser.email || "",

        photoURL:
          currentUser.photoURL || "",

        phone:
          phoneValue,

        address:
          addressValue,

        role:
          "customer",

        profileCompleted:
          true,

        updatedAt:
          serverTimestamp()

      },

      {
        merge:true
      }

    );


    /* Local backup */

    localStorage.setItem(
      "khidma_phone",
      phoneValue
    );

    localStorage.setItem(
      "khidma_address",
      addressValue
    );

    localStorage.setItem(
      "khidma_selfie",
      preview.src
    );


    message.innerText=
      "✅ Profile Firebase-এ সফলভাবে Save হয়েছে।";


    saveBtn.innerText=
      "✅ Saved";


    if(stream){

      stream
        .getTracks()
        .forEach(
          track=>track.stop()
        );

    }


    setTimeout(()=>{

      window.location.href=
        "./home.html";

    },1200);


  }

  catch(error){

    console.error(
      "FIREBASE ERROR:",
      error
    );


    message.innerText=
      "❌ Firebase Save হয়নি: " +
      error.code;


    saveBtn.disabled=false;

    saveBtn.innerText=
      "💾 আবার Save করুন";

  }

});

</script>

</body>
  </html>
