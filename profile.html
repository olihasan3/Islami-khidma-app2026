<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ইসলামী খিদমাহ - Profile</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7f5;
  color: #222;
}

.header {
  background: #087f3f;
  color: white;
  padding: 22px 18px;
  border-radius: 0 0 22px 22px;
}

.header h1 {
  margin: 0;
  font-size: 24px;
}

.container {
  padding: 18px;
}

.profile-card {
  background: white;
  padding: 18px;
  border-radius: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.profile-photo {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  margin: 0 auto 10px;
}

.name {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}

.camera-title {
  margin-top: 20px;
  font-weight: bold;
}

video,
canvas,
#selfiePreview {
  width: 100%;
  max-height: 350px;
  border-radius: 12px;
  margin-top: 10px;
  background: #111;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  background: #087f3f;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

button:disabled {
  opacity: 0.5;
}

input,
textarea {
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

label {
  display: block;
  margin-top: 16px;
  font-weight: bold;
}

#message {
  margin-top: 15px;
  text-align: center;
  font-weight: bold;
  line-height: 1.6;
}

</style>
</head>

<body>

<div class="header">
  <h1>☪️ ইসলামী খিদমাহ</h1>
</div>

<div class="container">

  <div class="profile-card">

    <!-- Google Profile -->

    <img
      id="googlePhoto"
      class="profile-photo"
      src=""
      alt="Profile"
    >

    <div
      id="googleName"
      class="name"
    >
      ব্যবহারকারী
    </div>


    <!-- Camera -->

    <div class="camera-title">
      📸 লাইভ Selfie
    </div>

    <video
      id="video"
      autoplay
      playsinline
    ></video>

    <button
      id="cameraBtn"
      type="button"
    >
      📷 ক্যামেরা চালু করুন
    </button>

    <button
      id="captureBtn"
      type="button"
      disabled
    >
      📸 Selfie নিন
    </button>

    <canvas
      id="canvas"
      style="display:none;"
    ></canvas>

    <img
      id="selfiePreview"
      style="display:none;"
      alt="Selfie Preview"
    >


    <!-- Phone -->

    <label for="phone">
      📱 মোবাইল নম্বর
    </label>

    <input
      id="phone"
      type="tel"
      inputmode="numeric"
      maxlength="11"
      placeholder="01XXXXXXXXX"
    >


    <!-- Address -->

    <label for="address">
      🏠 ঠিকানা
    </label>

    <textarea
      id="address"
      rows="3"
      placeholder="আপনার ঠিকানা লিখুন"
    ></textarea>


    <!-- Save -->

    <button
      id="saveBtn"
      type="button"
      disabled
    >
      💾 Profile Save করুন
    </button>

    <div id="message"></div>

  </div>

</div>


<script type="module">

/* =========================
   FIREBASE
========================= */

import { auth } from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =========================
   FIRESTORE
========================= */

const db = getFirestore();


/* =========================
   ELEMENTS
========================= */

const googlePhoto =
  document.getElementById("googlePhoto");

const googleName =
  document.getElementById("googleName");

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const selfiePreview =
  document.getElementById("selfiePreview");

const cameraBtn =
  document.getElementById("cameraBtn");

const captureBtn =
  document.getElementById("captureBtn");

const phone =
  document.getElementById("phone");

const address =
  document.getElementById("address");

const saveBtn =
  document.getElementById("saveBtn");

const message =
  document.getElementById("message");


let currentUser = null;
let cameraStream = null;
let selfieData = "";


/* =========================
   FIREBASE LOGIN CHECK
========================= */

onAuthStateChanged(auth, (user) => {

  if (!user) {

    window.location.href =
      "./index.html";

    return;
  }

  currentUser = user;


  googleName.innerText =
    user.displayName ||
    "ব্যবহারকারী";


  if (user.photoURL) {

    googlePhoto.src =
      user.photoURL;

  }


  checkForm();

});


/* =========================
   CAMERA
========================= */

cameraBtn.addEventListener(
  "click",
  async () => {

    try {

      cameraStream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user"
          },
          audio: false
        });


      video.srcObject =
        cameraStream;


      captureBtn.disabled =
        false;


      cameraBtn.innerText =
        "✅ ক্যামেরা চালু হয়েছে";


    }

    catch (error) {

      console.error(error);

      message.innerText =
        "❌ ক্যামেরা চালু করা যায়নি। Browser Camera Permission Allow করুন.";

    }

  }
);


/* =========================
   TAKE SELFIE
========================= */

captureBtn.addEventListener(
  "click",
  () => {

    if (!cameraStream) {
      return;
    }


    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    const ctx =
      canvas.getContext("2d");


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    selfieData =
      canvas.toDataURL(
        "image/jpeg",
        0.75
      );


    selfiePreview.src =
      selfieData;

    selfiePreview.style.display =
      "block";


    message.innerText =
      "✅ Selfie নেওয়া হয়েছে।";


    checkForm();

  }
);


/* =========================
   FORM CHECK
========================= */

phone.addEventListener(
  "input",
  checkForm
);

address.addEventListener(
  "input",
  checkForm
);


function checkForm() {

  const phoneValue =
    phone.value.trim();

  const addressValue =
    address.value.trim();


  const validPhone =
    /^01[3-9]\d{8}$/.test(
      phoneValue
    );


  if (
    selfieData &&
    validPhone &&
    addressValue
  ) {

    saveBtn.disabled =
      false;

  }

  else {

    saveBtn.disabled =
      true;

  }

}


/* =========================
   SAVE PROFILE
========================= */

saveBtn.addEventListener(
  "click",
  async () => {

    if (!currentUser) {

      message.innerText =
        "❌ User পাওয়া যায়নি।";

      return;
    }


    const phoneValue =
      phone.value.trim();

    const addressValue =
      address.value.trim();


    if (
      !/^01[3-9]\d{8}$/.test(
        phoneValue
      )
    ) {

      message.innerText =
        "❌ সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন।";

      return;
    }


    if (!addressValue) {

      message.innerText =
        "❌ ঠিকানা লিখুন।";

      return;
    }


    if (!selfieData) {

      message.innerText =
        "❌ আগে Selfie নিন।";

      return;
    }


    saveBtn.disabled =
      true;

    saveBtn.innerText =
      "⏳ Firebase-এ Save হচ্ছে...";


    try {

      /* =========================
         FIRESTORE USER DOCUMENT
      ========================= */

      await setDoc(

        doc(
          db,
          "users",
          currentUser.uid
        ),

        {

          uid:
            currentUser.uid,

          name:
            currentUser.displayName ||
            "",

          email:
            currentUser.email ||
            "",

          photoURL:
            currentUser.photoURL ||
            "",

          phone:
            phoneValue,

          address:
            addressValue,

          selfie:
            selfieData,

          role:
            "customer",

          profileCompleted:
            true,

          updatedAt:
            serverTimestamp(),

          createdAt:
            serverTimestamp()

        },

        {
          merge: true
        }

      );


      /* =========================
         LOCAL STORAGE
      ========================= */

      localStorage.setItem(
        "khidma_phone",
        phoneValue
      );

      localStorage.setItem(
        "khidma_address",
        addressValue
      );

      localStorage.setItem(
        "khidma_selfie",
        selfieData
      );


      message.innerText =
        "✅ Profile সফলভাবে Firebase-এ Save হয়েছে।";


      saveBtn.innerText =
        "✅ Saved";


      /* Stop camera */

      if (cameraStream) {

        cameraStream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

      }


      /* Go Home */

      setTimeout(
        () => {

          window.location.href =
            "./home.html";

        },
        1000
      );


    }

    catch (error) {

      console.error(
        "Firestore Error:",
        error
      );


      message.innerText =
        "❌ Firebase-এ Save হয়নি। আবার চেষ্টা করুন।";


      saveBtn.disabled =
        false;

      saveBtn.innerText =
        "💾 আবার Profile Save করুন";

    }

  }
);

</script>

</body>
  </html>
